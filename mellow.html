<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="무선부터 유선까지, 나에게 맞는 이어폰을 고르는 mellow 체험 쇼핑몰">
  <meta name="theme-color" content="#f8faff">
  <title>mellow | 나에게 맞는 이어폰</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f8faff;
  --white: #fff;
  --ink: #17243c;
  --muted: #52627c;
  --line: #dce4f1;
  --brand: #244cc5;
  --brand-dark: #193da9;
  --periwinkle: #e9efff;
  --night: #192d59;
  --error: #a12b39;
  --radius: 20px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
  font-size: 100%;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; }
body:has(dialog[open]) { overflow: hidden; }
h1, h2, h3, p, figure, ul { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { opacity: 0.52; cursor: default; }
:focus-visible { outline: 3px solid #5272ed; outline-offset: 3px; }
section[id] { scroll-margin-top: 24px; }

.sr-only, .skip-link:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip-link:focus {
  position: absolute;
  z-index: 3;
  inset: 6px auto auto 6px;
  padding: 10px 16px;
  border-radius: 8px;
  color: var(--white);
  background: var(--brand);
}

.wrap { width: min(calc(100% - 104px), 1320px); margin-inline: auto; }
.site-header { background: var(--white); border-bottom: 1px solid var(--line); }

.welcome-strip {
  display: flex;
  justify-content: center;
  color: #254180;
  background: #e4edfc;
}

.welcome-strip button {
  min-height: 36px;
  border: 0;
  padding: 5px 14px;
  background: transparent;
  font-size: 0.875rem;
}

.welcome-strip button:hover { text-decoration: underline; text-underline-offset: 3px; }
.welcome-strip strong { color: var(--brand-dark); }

.masthead {
  min-height: 74px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 24px;
  align-items: center;
}

.brand {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  gap: 9px;
  width: fit-content;
  font-size: 1.8rem;
  font-weight: 850;
  letter-spacing: -0.075em;
  line-height: 1;
}

.brand-mark {
  width: 31px;
  height: 31px;
  display: grid;
  grid-auto-flow: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 11px;
  background: var(--brand);
}

.brand-mark i { width: 3px; height: 9px; border-radius: 3px; background: var(--white); }
.brand-mark i:nth-child(2) { height: 17px; }
.brand-mark i:nth-child(3) { height: 12px; }
.store-nav, .header-actions { display: flex; align-items: center; gap: 20px; }
.header-actions { justify-self: end; gap: 6px; }

.store-nav a, .header-button {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  border-radius: 10px;
  padding: 6px 9px;
  font-size: 0.875rem;
  font-weight: 670;
  white-space: nowrap;
}

.store-nav a:hover, .header-button:hover { background: var(--periwinkle); }
.header-button { gap: 7px; border: 0; background: none; }

.cart-count {
  display: inline-grid;
  min-width: 21px;
  min-height: 21px;
  place-items: center;
  border-radius: 12px;
  padding-inline: 5px;
  color: var(--brand-dark);
  background: var(--periwinkle);
  font-size: 0.75rem;
  font-weight: 800;
}

.icon { display: inline-block; position: relative; flex: 0 0 18px; width: 18px; height: 18px; }
.icon::before, .icon::after { position: absolute; content: ""; }

.icon-user::before {
  inset: 1px auto auto 6px;
  width: 7px;
  height: 7px;
  border: 1.6px solid currentColor;
  border-radius: 50%;
}

.icon-user::after {
  inset: 10px auto auto 3px;
  width: 13px;
  height: 7px;
  border: 1.6px solid currentColor;
  border-bottom: 0;
  border-radius: 7px 7px 0 0;
}

.icon-bag::before {
  inset: 6px 2px 1px;
  border: 1.6px solid currentColor;
  border-radius: 2.5px;
}

.icon-bag::after {
  inset: 1px 6px auto;
  height: 7px;
  border: 1.6px solid currentColor;
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
}

.icon-search::before {
  inset: 1px auto auto 1px;
  width: 12px;
  height: 12px;
  border: 1.6px solid currentColor;
  border-radius: 50%;
}

.icon-search::after {
  inset: 12px auto auto 11px;
  width: 6px;
  height: 1.6px;
  background: currentColor;
  transform: rotate(45deg);
}

.icon-prev::before, .icon-next::before {
  inset: 5px auto auto 6px;
  width: 8px;
  height: 8px;
  border: solid currentColor;
  border-width: 0 1.7px 1.7px 0;
  transform: rotate(-45deg);
}

.icon-prev::before { left: 7px; transform: rotate(135deg); }
.icon-pause::before { inset: 4px 5px; border-inline: 2px solid currentColor; }
.icon-play::before {
  inset: 4px auto auto 6px;
  border: solid transparent;
  border-width: 5px 0 5px 8px;
  border-left-color: currentColor;
}

.icon-close::before, .icon-close::after {
  inset: 8px 1px auto;
  height: 1.7px;
  border-radius: 2px;
  background: currentColor;
  transform: rotate(45deg);
}

.icon-close::after { transform: rotate(-45deg); }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 12px;
  min-height: clamp(395px, 35vw, 490px);
  margin-top: 22px;
  --hero-panel: #eaf0ff;
}

.hero[data-slide="1"] { --hero-panel: #e6edf9; }
.hero[data-slide="2"] { --hero-panel: #fcece8; }
.hero[data-slide="3"] { --hero-panel: #f4eee5; }

.hero-copy {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 22px;
  padding: clamp(26px, 4.2vw, 62px);
  padding-bottom: 19px;
  border-radius: var(--radius);
  background: var(--hero-panel);
  transition: background-color 300ms ease;
}

.hero-message { margin-block: auto; }

.eyebrow {
  margin-bottom: 16px;
  color: var(--brand-dark);
  font-size: 0.875rem;
  font-weight: 760;
  letter-spacing: 0.02em;
}

.hero h1 {
  font-size: clamp(2.5rem, 4.35vw, 4.15rem);
  font-weight: 830;
  letter-spacing: -0.079em;
  line-height: 1.09;
  word-break: keep-all;
}

.hero-description {
  max-width: 24ch;
  margin-top: 16px;
  margin-bottom: 23px;
  color: var(--muted);
  word-break: keep-all;
}

.button {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 11px;
  padding: 10px 16px;
  text-align: center;
  font-size: 0.9375rem;
  font-weight: 720;
  line-height: 1.3;
}

.button-primary { color: var(--white); background: var(--brand); }
.button-primary:hover:not(:disabled) { background: var(--brand-dark); }
.button-light { color: var(--brand-dark); background: #f5f8ff; }
.button-light:hover { background: #e3ebff; }
.button-outline { border-color: #cbd7ea; background: var(--white); }
.button-outline:hover:not(:disabled) { background: var(--periwinkle); }
.button-full { width: 100%; }

.hero-photo {
  position: relative;
  min-width: 0;
  min-height: 100%;
  isolation: isolate;
  overflow: hidden;
  border-radius: var(--radius);
  background: #ceddf2;
}

.hero-photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  transition: opacity 430ms ease;
}

.hero-photo img.is-current { opacity: 1; }
.hero-photo figcaption { position: absolute; inset: auto auto 18px 18px; }

.hero-photo figcaption button {
  display: grid;
  gap: 0;
  max-width: 100%;
  border: 1px solid #ffffff9c;
  border-radius: 11px;
  padding: 8px 13px;
  color: var(--ink);
  background: #fffffff0;
  text-align: left;
}

.hero-photo figcaption button:hover { background: var(--white); }
.hero-photo figcaption strong { font-size: 0.9375rem; }
.hero-photo figcaption span { font-size: 0.8125rem; color: var(--muted); }

.slide-controls, .slide-dots { display: flex; align-items: center; }
.slide-controls { gap: 4px; }
.slide-dots { gap: 1px; }
.slide-control, .slide-dot {
  display: grid;
  place-items: center;
  min-height: 40px;
  border: 0;
  border-radius: 8px;
  background: transparent;
}

.slide-control { width: 38px; }
.slide-control:hover, .slide-dot:hover { background: #ffffffa0; }
.slide-dot { width: 26px; }
.slide-dot::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 6px;
  background: #7587aa;
}

.slide-dot[aria-current="true"]::before { width: 18px; background: var(--brand-dark); }

.collection { margin-top: 58px; }
.collection-heading, .membership-intro {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}

.collection h2, .membership h2 {
  font-size: clamp(1.7rem, 3.1vw, 2.35rem);
  line-height: 1.18;
  font-weight: 820;
  letter-spacing: -0.065em;
}

.result-count { min-height: 22px; margin-top: 6px; color: var(--muted); font-size: 0.875rem; }

.search-box {
  display: flex;
  align-items: center;
  gap: 9px;
  width: min(100%, 286px);
  min-height: 44px;
  border: 1px solid #cdd7e9;
  border-radius: 11px;
  padding-inline: 11px;
  background: var(--white);
  color: var(--muted);
}

.search-box:focus-within { outline: 2px solid #5272ed; outline-offset: 2px; }
.search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 0.9375rem; }
.search-box input::placeholder { color: #626f85; }
.filters { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; margin-bottom: 18px; }

.filter-button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 100px;
  padding: 7px 15px;
  background: var(--white);
  font-size: 0.875rem;
  font-weight: 700;
  white-space: nowrap;
}

.filter-button:hover { border-color: #6384dd; }
.filter-button[aria-pressed="true"] { color: var(--white); border-color: var(--night); background: var(--night); }

.product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

.product-card {
  position: relative;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--white);
}

.product-media {
  display: block;
  width: 100%;
  overflow: hidden;
  border: 0;
  padding: 0;
  background: var(--periwinkle);
}

.product-media:focus-visible { outline-offset: -4px; }
.product-media::after { position: absolute; inset: 0; content: ""; }

.product-media img {
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  transition: transform 220ms ease;
}

.product-media:hover img { transform: scale(1.045); }
.product-info { padding: 13px 14px 14px; }
.product-category { margin-bottom: 2px; color: var(--muted); font-size: 0.8125rem; font-weight: 650; }
.product-card h3 { font-size: 1.0625rem; line-height: 1.3; font-weight: 780; letter-spacing: -0.035em; overflow-wrap: anywhere; }
.product-color { margin-top: 3px; color: var(--muted); font-size: 0.8125rem; }
.product-bottom { display: flex; justify-content: space-between; align-items: center; gap: 3px; margin-top: 7px; }
.price { font-weight: 820; letter-spacing: -0.023em; }

.add-button, .quantity-button, .close-button {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 41px;
  height: 41px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0;
  color: var(--brand-dark);
  background: var(--periwinkle);
  font-size: 1.2rem;
  line-height: 1;
}

.add-button:hover:not(:disabled), .quantity-button:hover:not(:disabled), .close-button:hover { background: #dce6ff; }
.add-button { position: relative; }
.sold-out { color: var(--error); font-size: 0.8125rem; font-weight: 750; }
.empty { grid-column: 1 / -1; padding: 27px 16px; border: 1px dashed #cdd7e9; border-radius: 12px; text-align: center; color: var(--muted); }

.membership {
  margin-block: 62px;
  padding: clamp(22px, 4vw, 46px);
  border-radius: var(--radius);
  color: #f6f8ff;
  background: var(--night);
}

.membership-intro { align-items: center; }
.membership-intro p { margin-top: 8px; color: #d4dfff; word-break: keep-all; }
.tier-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: 22px; }

.tier-grid li {
  min-width: 0;
  display: grid;
  align-content: start;
  gap: 3px;
  border: 1px solid #50618b;
  border-radius: 12px;
  padding: 13px 14px;
  background: #253965;
}

.tier-name { color: #e8eeff; font-size: 0.9375rem; font-weight: 740; }
.tier-rate { color: #f8faff; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.18; }
.tier-threshold, .membership-note { color: #d4dfff; font-size: 0.8125rem; }
.membership-note { margin-top: 13px; word-break: keep-all; }

.site-footer { border-top: 1px solid var(--line); background: var(--white); }
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 88px; padding-block: 15px; }
.footer-row .brand { font-size: 1.5rem; }
.footer-row p { color: var(--muted); font-size: 0.8125rem; word-break: keep-all; }

.store-dialog {
  position: fixed;
  width: min(calc(100% - 32px), 540px);
  max-width: none;
  max-height: calc(100dvh - 28px);
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 0;
  color: var(--ink);
  background: var(--white);
  box-shadow: 0 12px 64px #182a5730;
}

.store-dialog::backdrop { background: #101c35a0; }
.store-dialog[data-view="product"] { width: min(calc(100% - 32px), 800px); }

.store-dialog[data-view="cart"] {
  inset: 0 0 0 auto;
  width: min(100%, 470px);
  height: 100dvh;
  max-height: none;
  margin: 0;
  border-block: 0;
  border-right: 0;
  border-radius: 18px 0 0 18px;
}

.dialog-header {
  position: sticky;
  z-index: 1;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  padding: 13px 19px;
  background: var(--white);
}

.dialog-header h2 { min-width: 0; font-size: 1.25rem; letter-spacing: -0.045em; overflow-wrap: anywhere; }
.close-button { color: var(--ink); background: #f3f6fd; }
.dialog-body { padding: 19px; }
.dialog-message { margin: 0; padding: 0 19px 17px; color: var(--error); font-size: 0.875rem; }
.dialog-message:empty { display: none; }

.product-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 19px; }
.product-detail img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--periwinkle); }
.detail-content { display: grid; gap: 10px; min-width: 0; }
.detail-content .price { font-size: 1.5rem; }
.detail-content p { overflow-wrap: anywhere; }
.detail-feature { color: var(--brand-dark); font-weight: 700; }
.detail-meta, .field-note { color: var(--muted); font-size: 0.875rem; }
.detail-actions, .account-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-actions form { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-actions label { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 700; }
.detail-actions input {
  width: 64px;
  min-height: 44px;
  border: 1px solid #cbd7ea;
  border-radius: 9px;
  padding: 5px 7px;
}

.cart-lines, .order-list { display: grid; gap: 10px; }
.cart-line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: start; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 11px; }
.cart-line img { width: 64px; aspect-ratio: 1; object-fit: cover; border-radius: 9px; background: var(--periwinkle); }
.cart-line h3 { font-size: 0.9375rem; overflow-wrap: anywhere; }
.cart-line .price { font-size: 0.875rem; white-space: nowrap; }
.cart-line .stock-warning { grid-column: 2 / -1; color: var(--error); font-size: 0.8125rem; }

.quantity { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.quantity-button { width: 34px; height: 34px; border-radius: 7px; background: #f3f6fd; }
.quantity output { min-width: 2ch; text-align: center; font-size: 0.875rem; }
.line-right { display: grid; justify-items: end; gap: 2px; }

.text-button {
  min-height: 39px;
  border: 0;
  border-radius: 6px;
  padding: 4px 0;
  color: var(--brand-dark);
  background: transparent;
  font-size: 0.875rem;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.summary { display: grid; gap: 9px; margin-top: 17px; }
.summary-row, .order-item { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.summary-row strong, .order-item strong { flex: 0 0 auto; }
.summary-row.total { border-top: 1px solid var(--line); padding-top: 10px; font-weight: 750; }
.summary-row.total strong { font-size: 1.17rem; }
.summary .button { margin-top: 4px; }

.form { display: grid; gap: 11px; }
.form label { display: grid; gap: 4px; color: var(--ink); font-size: 0.9375rem; font-weight: 700; }
.form input {
  width: 100%;
  min-height: 43px;
  border: 1px solid #cbd7ea;
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--ink);
  font-size: 1rem;
  font-weight: 400;
}

.form-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 0.875rem; }
.account-panel, .notice { padding: 13px; border-radius: 11px; background: #eef3ff; }
.account-panel { display: grid; gap: 6px; overflow-wrap: anywhere; }
.account-panel .price { color: var(--brand-dark); }
.account-actions { margin-block: 11px 20px; }
.order-heading { margin-bottom: 9px; font-size: 1.05rem; }
.order-card { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 11px; padding: 11px; }
.order-card h3 { font-size: 0.875rem; }
.order-card .order-item { font-size: 0.875rem; }
.order-success { display: grid; gap: 10px; }
.notice { color: var(--muted); font-size: 0.875rem; }
.notice + .summary { margin-top: 10px; }

.toast {
  position: fixed;
  z-index: 2;
  inset: auto 16px 16px auto;
  width: max-content;
  max-width: calc(100% - 32px);
  border-radius: 10px;
  padding: 10px 13px;
  color: var(--white);
  background: var(--night);
  font-size: 0.875rem;
  box-shadow: 0 4px 20px #182a5730;
}

.toast:empty { display: none; }

@media (max-width: 960px) {
  .wrap { width: calc(100% - 48px); }
  .masthead { gap: 12px; }
  .header-cart-label { display: none; }
  .hero { min-height: 370px; }
  .hero-copy { padding: 24px; padding-bottom: 13px; }
  .hero h1 { font-size: clamp(2.15rem, 4.9vw, 3.3rem); }
  .product-grid { gap: 11px; }
}

@media (max-width: 700px) {
  .wrap { width: calc(100% - 32px); }
  .masthead { grid-template-columns: minmax(0, 1fr) auto; min-height: 60px; gap: 0 6px; }
  .brand { gap: 7px; font-size: 1.55rem; }
  .brand-mark { width: 26px; height: 26px; border-radius: 9px; }
  .header-actions { gap: 1px; }
  .header-button { gap: 5px; padding-inline: 5px; }
  .store-nav { grid-column: 1 / -1; grid-row: 2; gap: 6px; border-top: 1px solid var(--line); }
  .store-nav a { min-height: 40px; padding-inline: 9px; }
  .hero { grid-template-columns: minmax(0, 1fr); min-height: auto; gap: 0; margin-top: 13px; }
  .hero-photo { grid-row: 1; aspect-ratio: 1.58; border-radius: 15px 15px 0 0; }
  .hero-copy { gap: 11px; border-radius: 0 0 15px 15px; padding: 17px 16px 6px; }
  .hero-message { margin-block: 0; }
  .eyebrow { margin-bottom: 7px; }
  .hero h1 { font-size: clamp(2rem, 6.9vw, 2.65rem); }
  .hero-description { max-width: 36ch; margin-block: 8px 12px; font-size: 0.9375rem; }
  .hero-photo figcaption { inset: auto auto 10px 10px; }
  .hero-photo figcaption button { padding: 4px 9px; }
  .collection { margin-top: 31px; }

function escapeHtml(value) {
  const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value).replace(/[&<>"']/g, (character) => entities[character]);
}

function emptyStore() {
  return { members: [], carts: {}, orders: [] };
}

function loadStore() {
  const raw = localStorage.getItem(STORE_KEY);
  return raw ? JSON.parse(raw) : emptyStore();
}

function readStore() {
  try {
    return loadStore();
  } catch {
    return emptyStore();
  }
}

// 주문, 포인트, 장바구니 변경을 한 번에 저장합니다.
async function changeStore(change) {
  const commit = () => {
    let store;
    try {
      store = loadStore();
    } catch {
      throw new Error("브라우저의 쇼핑몰 데이터를 읽을 수 없어요.");
    }

    const result = change(store);

    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch {
      throw new Error("브라우저에 저장할 수 없어요. 저장 공간 설정을 확인해 주세요.");
    }
    return result;
  };

  return navigator.locks ? navigator.locks.request(STORE_KEY, commit) : commit();
}

function currentMember(store) {
  try {
    const memberId = sessionStorage.getItem(SESSION_KEY);
    return store.members.find((member) => member.id === memberId);
  } catch {
    return undefined;
  }
}

function setSession(memberId) {
  if (memberId) sessionStorage.setItem(SESSION_KEY, memberId);
  else sessionStorage.removeItem(SESSION_KEY);
}

function makeId(size = 12) {
  const bytes = crypto.getRandomValues(new Uint8Array(size));
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function hashPassword(password, salt) {
  if (!crypto.subtle) throw new Error("계정 기능은 HTTPS 주소 또는 로컬 미리보기에서 이용해 주세요.");
  const encoder = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: encoder.encode(salt), iterations: 120000, hash: "SHA-256" }, key, 256
  );
  return Array.from(new Uint8Array(bits), (byte) => byte.toString(16).padStart(2, "0")).join("");
}

function tierFor(member) {
  return MEMBERSHIP_TIERS.findLast((tier) => member.totalSpent >= tier.minSpend) ?? MEMBERSHIP_TIERS[0];
}

function stockLeft(store, product) {
  let sold = 0;
  for (const order of store.orders) {
    for (const item of order.items) {
      if (item.productId === product.id) sold += item.quantity;
    }
  }
  return Math.max(0, product.stock - sold);
}

function cartKey(store) {
  return currentMember(store)?.id ?? GUEST;
}

function cartLines(store) {
  const cart = store.carts[cartKey(store)] ?? {};
  return PRODUCTS.filter((product) => cart[product.id] > 0).map((product) => ({
    product, quantity: cart[product.id], stock: stockLeft(store, product)
  }));
}

function cartTotal(lines) {
  return lines.reduce((sum, line) => sum + line.product.price * line.quantity, 0);
}

function mergeGuestCart(store, memberId) {
  const guestCart = store.carts[GUEST] ?? {};
  const memberCart = store.carts[memberId] ??= {};
  for (const product of PRODUCTS) {
    if (!guestCart[product.id]) continue;
    const combined = (memberCart[product.id] ?? 0) + guestCart[product.id];
    const quantity = Math.min(combined, stockLeft(store, product));
    if (quantity > 0) memberCart[product.id] = quantity;
    else delete memberCart[product.id];
  }
  delete store.carts[GUEST];
}

async function addToCart(product, quantity) {
  await changeStore((store) => {
    const cart = store.carts[cartKey(store)] ??= {};
    const updated = (cart[product.id] ?? 0) + quantity;
    if (!Number.isInteger(quantity) || quantity < 1 || updated > stockLeft(store, product)) {
      throw new Error("재고 범위 안에서 수량을 선택해 주세요.");
    }
    cart[product.id] = updated;
  });
  updateHeader(readStore());
}

const hero = document.querySelector(".hero");
const heroPhotos = [...hero.querySelectorAll(".hero-photo img")];
const slideDots = [...hero.querySelectorAll(".slide-dot")];
const slideToggle = byId("slide-toggle");
const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
let slideIndex = 0;
let paused = motion.matches;
let slideTimer;

function renderSlide(index) {
  slideIndex = (index + SLIDES.length) % SLIDES.length;
  const slide = SLIDES[slideIndex];
  const product = productById(slide.productId);
  hero.dataset.slide = slideIndex;
  byId("hero-category").textContent = slide.label;
  byId("hero-title").replaceChildren(slide.title[0], document.createElement("br"), slide.title[1]);
  byId("hero-desc").textContent = slide.description;
  byId("hero-link").textContent = `${slide.label} 보기`;

  const productButton = byId("hero-product");
  productButton.dataset.id = product.id;
  productButton.setAttribute("aria-label", `${product.name} 상세 보기`);
  byId("hero-product-name").textContent = product.name;
  byId("hero-product-color").textContent = product.color;

  heroPhotos.forEach((photo, position) => {
    photo.classList.toggle("is-current", position === slideIndex);
    if (position === slideIndex) photo.removeAttribute("aria-hidden");
    else photo.setAttribute("aria-hidden", "true");
  });

  slideDots.forEach((dot, position) => {
    if (position === slideIndex) dot.setAttribute("aria-current", "true");
    else dot.removeAttribute("aria-current");
  });
}

function restartSlideshow() {
  clearInterval(slideTimer);
  slideToggle.setAttribute("aria-label", paused ? "자동 재생 시작" : "자동 재생 일시정지");
  slideToggle.firstElementChild.className = paused ? "icon icon-play" : "icon icon-pause";
  if (!paused && !document.hidden) {
    slideTimer = setInterval(() => renderSlide(slideIndex + 1), SLIDE_INTERVAL);
  }
}

function selectSlide(index) {
  renderSlide(index);
  restartSlideshow();
}

const search = byId("search");
const filters = byId("filters");
const productGrid = byId("products");
let selectedCategory = "전체";
const categories = ["전체", ...new Set(PRODUCTS.map((product) => product.category))];

function searchKey(value) {
  return value.normalize("NFKC").toLowerCase().replace(/\s/g, "");
}

function productCard(product, store) {
  const name = escapeHtml(product.name);
  const soldOut = stockLeft(store, product) === 0;

  return `
    <article class="product-card">
      <button class="product-media" type="button" data-action="product" data-id="${product.id}" aria-label="${name} 상세 보기">
        <img src="${PRODUCT_IMAGES[product.image]}" alt="${name} ${escapeHtml(product.color)}" width="640" height="480" loading="lazy" decoding="async">
      </button>
      <div class="product-info">
        <p class="product-category">${escapeHtml(product.category)}</p>
        <h3>${name}</h3>
        <p class="product-color">${escapeHtml(product.color)}</p>
        <div class="product-bottom">
          <p class="price">${won(product.price)}</p>
          ${soldOut ? '<span class="sold-out">품절</span>' : `
            <button class="add-button" type="button" data-action="add" data-id="${product.id}" aria-label="${name} 장바구니에 담기">+</button>`}
        </div>
      </div>
    </article>`;
}

function renderProducts(store = readStore()) {
  const query = searchKey(search.value);
  const matches = PRODUCTS.filter((product) => {
    const inCategory = selectedCategory === "전체" || product.category === selectedCategory;
    const text = `${product.name} ${product.category} ${product.color} ${product.feature}`;
    return inCategory && searchKey(text).includes(query);
  });

  byId("result-count").textContent = `상품 ${matches.length}개`;
  productGrid.innerHTML = matches.length
    ? matches.map((product) => productCard(product, store)).join("")
    : '<p class="empty">찾는 상품이 없어요. 검색어나 분류를 바꿔 보세요.</p>';
}

function selectCategory(category) {
  selectedCategory = category;
  for (const button of filters.querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.category === category));
  }
  renderProducts();
}

function renderTiers() {
  byId("tiers").innerHTML = MEMBERSHIP_TIERS.map((tier) => `
    <li>
      <span class="tier-name">${escapeHtml(tier.name)}</span>
      <strong class="tier-rate">${tier.earnRate}%</strong>
      <span class="tier-threshold">${tier.minSpend === 0 ? "가입 즉시" : `누적 ${won(tier.minSpend)} 이상`}</span>
    </li>`).join("");
}

function updateHeader(store) {
  const member = currentMember(store);
  const count = cartLines(store).reduce((sum, line) => sum + line.quantity, 0);
  byId("account-label").textContent = member ? "마이페이지" : "로그인";
  byId("cart-count").textContent = count;
  byId("cart-button").setAttribute("aria-label", `장바구니, ${count}개`);
  byId("membership-button").textContent = member ? "내 등급 보기" : "가입하고 3,000P 받기";
}

let toastTimer;

function announce(message) {
  if (dialog.open) {
    dialogMessage.textContent = message;
    return;
  }
  const toast = byId("toast");
  toast.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.textContent = ""; }, 3000);
}

const dialog = byId("store-dialog");
const dialogTitle = byId("dialog-title");
const dialogBody = byId("dialog-body");
const dialogMessage = byId("dialog-message");
let view;
let opener;
let submitting = false;

function showView(type, options = {}) {
  const isOpen = dialog.open;
  if (!isOpen) opener = document.activeElement;
  view = { type, ...options };
  renderDialog();
  if (!isOpen) dialog.showModal();
  dialog.scrollTop = 0;
  dialogTitle.focus();
}

function renderProductDetail(store, product) {
  const stock = stockLeft(store, product);
  const cartQuantity = store.carts[cartKey(store)]?.[product.id] ?? 0;
  const limit = stock - cartQuantity;
  return `
    <div class="product-detail">
      <img src="${PRODUCT_IMAGES[product.image]}" alt="${escapeHtml(product.name)} ${escapeHtml(product.color)}" width="640" height="480">
      <div class="detail-content">
        <p class="detail-meta">${escapeHtml(product.category)} · ${escapeHtml(product.color)}</p>
        <p class="price">${won(product.price)}</p>
        <p>${escapeHtml(product.description)}</p>
        <p class="detail-feature">${escapeHtml(product.feature)}</p>
        <p class="detail-meta">${stock > 0 ? `남은 재고 ${stock}개` : "품절"}</p>
        <div class="detail-actions">
          ${limit > 0 ? `
            <form id="detail-form" method="dialog">
              <label>수량 <input name="quantity" type="number" min="1" max="${limit}" value="1" inputmode="numeric" required></label>
              <button class="button button-primary" type="submit">장바구니 담기</button>
            </form>` : '<p class="detail-meta">현재 더 담을 수 있는 수량이 없어요.</p>'}
          <button class="button button-outline" type="button" data-action="cart">장바구니 보기</button>
        </div>
      </div>
    </div>`;
}

function renderCart(store) {
  const lines = cartLines(store);
  if (lines.length === 0) {
    return '<p class="empty">장바구니가 비어 있어요.</p><div class="summary"><button class="button button-primary" type="button" data-action="browse">이어폰 둘러보기</button></div>';
  }

  const hasStockIssue = lines.some((line) => line.quantity > line.stock);
  return `
    <ul class="cart-lines">
      ${lines.map(({ product, quantity, stock }) => {
        const name = escapeHtml(product.name);
        return `
          <li class="cart-line">
            <img src="${PRODUCT_IMAGES[product.image]}" alt="" width="64" height="64">
            <div>
              <h3>${name}</h3>
              <div class="quantity">
                <button class="quantity-button" type="button" data-action="quantity" data-id="${product.id}" data-step="-1" aria-label="${name} 수량 줄이기" ${quantity <= 1 ? "disabled" : ""}>−</button>
                <output aria-label="${name} 수량">${quantity}</output>
                <button class="quantity-button" type="button" data-action="quantity" data-id="${product.id}" data-step="1" aria-label="${name} 수량 늘리기" ${quantity >= stock ? "disabled" : ""}>+</button>
              </div>
            </div>
            <div class="line-right">
              <strong class="price">${won(product.price * quantity)}</strong>
              <button class="text-button" type="button" data-action="remove" data-id="${product.id}" aria-label="${name} 삭제">삭제</button>
            </div>
            ${quantity > stock ? `<p class="stock-warning">재고가 ${stock}개예요. 수량을 줄이거나 상품을 삭제해 주세요.</p>` : ""}
          </li>`;
      }).join("")}
    </ul>
    <div class="summary">
      <div class="summary-row total"><span>상품 합계</span><strong>${won(cartTotal(lines))}</strong></div>
      <button class="button button-primary" type="button" data-action="checkout" ${hasStockIssue ? "disabled" : ""}>체험 결제하기</button>
    </div>`;
}

function renderAuth(mode, next) {
  const joining = mode === "signup";
  return `
    <p class="field-note">체험 계정은 이 브라우저에 저장돼요. 예시 이메일과 비밀번호를 사용해 주세요.</p>
    <form class="form summary" id="auth-form" method="dialog">
      ${joining ? '<label>이름<input name="displayName" type="text" autocomplete="nickname" maxlength="24" required></label>' : ""}
      <label>이메일<input name="email" type="email" autocomplete="username" maxlength="120" placeholder="mellow@example.com" required></label>
      <label>비밀번호<input name="password" type="password" autocomplete="${joining ? "new-password" : "current-password"}" minlength="8" maxlength="128" ${joining ? 'placeholder="8자 이상"' : ""} required></label>
      <button class="button button-primary" type="submit">${joining ? "가입하고 3,000P 받기" : "로그인"}</button>
    </form>
    <div class="form-switch">
      <span>${joining ? "이미 가입하셨나요?" : "mellow가 처음인가요?"}</span>
      <button class="text-button" type="button" data-action="auth-mode" data-mode="${joining ? "login" : "signup"}">${joining ? "로그인" : "회원가입"}</button>
    </div>
    ${next === "checkout" ? '<button class="text-button" type="button" data-action="cart">장바구니로 돌아가기</button>' : ""}`;
}

function renderAccount(store, member) {
  const tier = tierFor(member);
  const orders = store.orders.filter((order) => order.memberId === member.id).reverse();
  return `
    <div class="account-panel">
      <strong>${escapeHtml(member.name)}님</strong>
      <p class="field-note">${escapeHtml(member.email)}</p>
      <p>${escapeHtml(tier.name)} 등급 · ${tier.earnRate}% 적립</p>
      <p>보유 포인트 <strong class="price">${points(member.points)}</strong></p>
      <p class="field-note">누적 구매 금액 ${won(member.totalSpent)}</p>
    </div>
    <div class="account-actions">
      <button class="button button-outline" type="button" data-action="logout">로그아웃</button>
    </div>
    <h3 class="order-heading" id="order-heading" tabindex="-1">주문 내역</h3>
    ${orders.length ? `<ul class="order-list">${orders.map((order) => `
      <li class="order-card">
        <h3>${orderDate.format(new Date(order.createdAt))} · 체험 주문</h3>
        <ul>${order.items.map((item) => `
          <li class="order-item"><span>${escapeHtml(item.name)} × ${item.quantity}</span><strong>${won(item.unitPrice * item.quantity)}</strong></li>`).join("")}
        </ul>
        <div class="summary-row field-note"><span>적립 ${points(order.pointsEarned)} (${order.earnRate}%)</span><strong>${won(order.total)}</strong></div>
      </li>`).join("")}</ul>` : '<p class="empty">아직 주문 내역이 없어요.</p>'}`;
}

function checkoutKey(member, lines) {
  const quantities = lines.map(({ product, quantity }) => [product.id, product.price, quantity]);
  return JSON.stringify([member.id, member.totalSpent, quantities]);
}

function renderCheckout(member, lines) {
  const total = cartTotal(lines);
  const tier = tierFor(member);
  const earned = Math.floor(total * tier.earnRate / 100);
  return `
    <p class="notice">결제 정보를 입력할 필요 없이, 체험 주문이 주문 내역에 기록돼요.</p>
    <form id="checkout-form" class="summary" method="dialog">
      <ul class="order-list">${lines.map(({ product, quantity }) => `
        <li class="order-item"><span>${escapeHtml(product.name)} × ${quantity}</span><strong>${won(product.price * quantity)}</strong></li>`).join("")}
      </ul>
      <div class="summary-row total"><span>상품 합계</span><strong>${won(total)}</strong></div>
      <div class="summary-row"><span>예상 적립 (${tier.name} ${tier.earnRate}%)</span><strong>${points(earned)}</strong></div>
      <button class="button button-primary" type="submit">체험 주문 확정</button>
      <button class="button button-outline" type="button" data-action="cart">장바구니로 돌아가기</button>
    </form>`;
}

function renderOrderSuccess(order) {
  return `
    <div class="order-success">
      <p>체험 주문이 마이페이지에 저장됐어요.</p>
      <div class="summary-row"><span>주문 금액</span><strong>${won(order.total)}</strong></div>
      <div class="summary-row"><span>적립 포인트</span><strong>${points(order.pointsEarned)}</strong></div>
      <button class="button button-primary" type="button" data-action="orders">주문 내역 보기</button>
    </div>`;
}

function renderDialog(store = readStore()) {
  const member = currentMember(store);
  let title;
  let content;
  dialogMessage.textContent = "";

  switch (view.type) {
    case "product": {
      const product = productById(view.id);
      title = product.name;
      content = renderProductDetail(store, product);
      break;
    }
    case "cart":
      title = "장바구니";
      content = renderCart(store);
      break;
    case "auth":
      title = view.mode === "signup" ? "회원가입" : "로그인";
      content = renderAuth(view.mode, view.next);
      break;
    case "account":
      title = "마이페이지";
      content = renderAccount(store, member);
      break;
    case "checkout": {
      const lines = cartLines(store);
      title = "체험 결제";
      view.checkoutKey = checkoutKey(member, lines);
      content = renderCheckout(member, lines);
      break;
    }
    case "success":
      title = "체험 주문 완료";
      content = renderOrderSuccess(view.order);
      break;
  }

  dialog.dataset.view = view.type;
  dialogTitle.textContent = title;
  dialogBody.innerHTML = content;
}

function openAccount(signup = false) {
  if (currentMember(readStore())) showView("account");
  else showView("auth", { mode: signup ? "signup" : "login", next: "account" });
}

function openCheckout() {
  const store = readStore();
  const lines = cartLines(store);
  if (!lines.length || lines.some((line) => line.quantity > line.stock)) {
    showView("cart");
    announce("장바구니의 상품과 수량을 확인해 주세요.");
  } else if (currentMember(store)) {
    showView("checkout");
  } else {
    showView("auth", { mode: "login", next: "checkout" });
    announce("주문 내역을 저장하려면 로그인해 주세요.");
  }
}

async function authenticate(form) {
  const email = form.elements.email.value.trim().toLowerCase();
  const password = form.elements.password.value;
  const next = view.next;
  let memberId;

  if (view.mode === "signup") {
    const name = form.elements.displayName.value.trim();
    if (!name) throw new Error("이름을 입력해 주세요.");
    if (password.trim().length < 8) throw new Error("비밀번호는 공백을 제외하고 8자 이상 입력해 주세요.");
    const salt = makeId(16);
    const passwordHash = await hashPassword(password, salt);
    memberId = makeId();

    await changeStore((store) => {
      if (store.members.some((member) => member.email === email)) {
        throw new Error("이미 가입된 이메일이에요. 로그인해 주세요.");
      }
      store.members.push({ id: memberId, name, email, salt, passwordHash, points: WELCOME_POINTS, totalSpent: 0 });
      mergeGuestCart(store, memberId);
    });
  } else {
    const member = readStore().members.find((item) => item.email === email);
    if (!member || await hashPassword(password, member.salt) !== member.passwordHash) {
      throw new Error("이메일과 비밀번호를 다시 확인해 주세요.");
    }
    memberId = member.id;
    await changeStore((store) => mergeGuestCart(store, memberId));
  }

  setSession(memberId);
  updateHeader(readStore());
  if (next === "checkout") openCheckout();
  else showView("account");
}

async function updateCartLine(button) {
  const product = productById(button.dataset.id);
  await changeStore((store) => {
    const cart = store.carts[cartKey(store)];
    if (!cart?.[product.id]) return;

    if (button.dataset.action === "remove") {
      delete cart[product.id];
      return;
    }

    const step = Number(button.dataset.step);
    const quantity = cart[product.id] + step;
    if (quantity < 1 || (step > 0 && quantity > stockLeft(store, product))) {
      throw new Error("선택할 수 있는 수량을 확인해 주세요.");
    }
    cart[product.id] = quantity;
  });

  const store = readStore();
  updateHeader(store);
  if (view?.type !== "cart") return;
  renderDialog(store);
  const replacement = [...dialogBody.querySelectorAll("button")].find((candidate) =>
    candidate.dataset.id === button.dataset.id && candidate.dataset.step === button.dataset.step &&
    candidate.dataset.action === button.dataset.action && !candidate.disabled
  );
  (replacement ?? dialogTitle).focus();
}

async function placeOrder() {
  const expectedKey = view.checkoutKey;
  const order = await changeStore((store) => {
    const member = currentMember(store);
    const lines = cartLines(store);
    if (!member || !lines.length || lines.some((line) => line.quantity > line.stock) ||
        checkoutKey(member, lines) !== expectedKey) {
      return null;
    }

    const total = cartTotal(lines);
    const tier = tierFor(member);
    const pointsEarned = Math.floor(total * tier.earnRate / 100);
    const order = {
      id: makeId(), memberId: member.id, createdAt: new Date().toISOString(),
      items: lines.map(({ product, quantity }) => ({
        productId: product.id, name: product.name, unitPrice: product.price, quantity
      })),
      total, tierId: tier.id, earnRate: tier.earnRate, pointsEarned
    };

    store.orders.push(order);
    member.points += pointsEarned;
    member.totalSpent += total;
    delete store.carts[member.id];
    return order;
  });

  const store = readStore();
  updateHeader(store);
  if (order) {
    renderProducts(store);
    showView("success", { order });
  } else {
    openCheckout();
    announce("장바구니 또는 등급이 바뀌었어요. 주문 내용을 다시 확인해 주세요.");
  }
}

document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button || submitting) return;
  const product = productById(button.dataset.id);

  try {
    switch (button.dataset.action) {
      case "slide-prev": selectSlide(slideIndex - 1); break;
      case "slide-next": selectSlide(slideIndex + 1); break;
      case "slide-go": selectSlide(Number(button.dataset.index)); break;
      case "slide-toggle":
        paused = !paused;
        restartSlideshow();
        break;
      case "filter": selectCategory(button.dataset.category); break;
      case "product": showView("product", { id: product.id }); break;
      case "add":
        await addToCart(product, 1);
        announce(`장바구니에 ${product.name} 상품을 담았어요.`);
        break;
      case "account": openAccount(); break;
      case "welcome": openAccount(true); break;
      case "auth-mode": showView("auth", { mode: button.dataset.mode, next: view.next }); break;
      case "cart": showView("cart"); break;
      case "checkout": openCheckout(); break;
      case "quantity":
      case "remove":
        await updateCartLine(button);
        break;
      case "orders":
        openAccount();
        byId("order-heading")?.focus();
        break;
      case "logout":
        setSession();
        updateHeader(readStore());
        dialog.close();
        announce("로그아웃했어요.");
        break;
      case "browse":
        dialog.close();
        byId("shop").scrollIntoView();
        break;
      case "close": dialog.close(); break;
    }
  } catch (error) {
    announce(error.message);
  }
});

dialog.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (submitting) return;
  const form = event.target;
  const submitButton = form.querySelector('button[type="submit"]');
  submitting = true;
  submitButton.disabled = true;
  dialogMessage.textContent = "";

  try {
    if (form.id === "detail-form") {
      await addToCart(productById(view.id), Number(form.elements.quantity.value));
      showView("cart");
    } else if (form.id === "auth-form") {
      await authenticate(form);
    } else if (form.id === "checkout-form") {
      await placeOrder();
    }
  } catch (error) {
    announce(error.message);
  } finally {
    submitting = false;
    if (submitButton.isConnected) submitButton.disabled = false;
  }
});

dialog.addEventListener("cancel", (event) => {
  if (submitting) event.preventDefault();
});

dialog.addEventListener("click", (event) => {
  if (event.target === dialog && !submitting) dialog.close();
});

dialog.addEventListener("close", () => {
  if (dialog.open) return;
  view = undefined;
  if (opener?.isConnected) opener.focus({ preventScroll: true });
});

byId("hero-link").addEventListener("click", () => {
  search.value = "";
  selectCategory(productById(SLIDES[slideIndex].productId).category);
});

search.addEventListener("input", () => renderProducts());
document.addEventListener("visibilitychange", restartSlideshow);
motion.addEventListener("change", (event) => {
  paused = event.matches;
  restartSlideshow();
});

window.addEventListener("storage", (event) => {
  if (event.key !== STORE_KEY && event.key !== null) return;
  const store = readStore();
  updateHeader(store);
  renderProducts(store);
  if (view?.type === "cart") renderDialog(store);
  if (view?.type === "account") openAccount();
});

filters.innerHTML = categories.map((category) => `
  <button class="filter-button" type="button" data-action="filter" data-category="${escapeHtml(category)}" aria-pressed="${category === selectedCategory}">${escapeHtml(category)}</button>`
).join("");

const initialStore = readStore();
renderProducts(initialStore);
renderTiers();
updateHeader(initialStore);
restartSlideshow();
  </script>
</body>
</html>
